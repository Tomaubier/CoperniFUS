[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coperniFUS*"]
exclude = ["joss_paper*", "docs*"]

[tool.setuptools]
include-package-data = true
package-data = { "coperniFUS" = ["examples/**"] }

[project]
name = "coperniFUS"
description = "A flexible Python-based GUI for stereotaxic experiment planning"
keywords = ["ultrasound", "neuroscience", "neurostimulation", "neuromodulation"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Tom Aubier", email = "tom.aubier@inserm.fr" },
]
version = "0.1.2"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "PyOpenGL==3.1.10",
    "PyQt6==6.7.0",
    "scipy==1.15.3",
    "networkx==3.5",
    "pyqtgraph==0.14.0",
    "brainglobe_atlasapi==2.0.7",
    "scikit-spatial==9.0.1",
    "si-prefix==1.3.3",
    "shapely==2.1.1",
    "rtree==1.3.0",
    "zarr==2.18.3",
    "numcodecs==0.15.1",
    "pillow==12.3.0",
    "tqdm==4.70.0",
    "dask==2025.3.0",
    "rembg==2.0.69",
    "opencv-python==4.13.0.92",
    "pymeshfix==0.17.1",
    "manifold3d==3.1.1",
    "mapbox_earcut==2.0.0",
    "trimesh==5.0.0",
    "matplotlib==3.10.9",
    "k-Wave-python==0.6.2"
]
classifiers = [
  "Programming Language :: Python"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-qt",
]
doc = [
    "sphinx",
    "furo",
    "nbsphinx",
    "nbconvert",
    "sphinx",
    "sphinx_mdinclude",
    "myst",
]

[project.urls]
Documentation = "https://copernifus.readthedocs.io/"
Repository = "https://github.com/Tomaubier/CoperniFUS.git"
"Bug Tracker" = "https://github.com/Tomaubier/CoperniFUS/issues?q=is%3Aissue"

[project.scripts]
coperniFUS = "coperniFUS.__main__:main"
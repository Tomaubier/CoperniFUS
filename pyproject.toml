[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coperniFUS*"]
exclude = ["joss_paper*", "docs*"]

[tool.setuptools]
include-package-data = true
package-data = { "coperniFUS" = ["examples/**"] }

[project]
name = "coperniFUS"
description = "A flexible Python-based GUI for stereotaxic experiment planning"
keywords = ["ultrasound", "neuroscience", "neurostimulation", "neuromodulation"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Tom Aubier", email = "tom.aubier@inserm.fr" },
]
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
    "PyQt6==6.7.0",
    "numpy==1.26.4",
    "scipy==1.14.1",
    "networkx==3.5",
    "pyqtgraph==0.13.7",
    "brainglobe_atlasapi==2.0.7",
    "scikit-spatial==7.2.0",
    "si-prefix==1.3.3",
    "numpy-stl==3.1.1",
    "shapely==2.1.1",
    "rtree==1.3.0",
    "mapbox_earcut==1.0.1",
    "zarr==2.18.3",
    "pillow==10.3.0",
    "tqdm==4.66.4",
    "dask==2025.3.0",
    "rembg==2.0.59",
    "opencv-python==4.10.0.84",
    "pymeshfix==0.17.1",
    "manifold3d==3.1.1",
    "trimesh==4.6.12",
    "matplotlib==3.10.0",
    "napari==0.6.1",
    "onnxruntime==1.19.2",
    "k-Wave-python==0.4.0",
]
classifiers = [
  "Programming Language :: Python"
]

[project.urls]
Documentation = "https://copernifus.readthedocs.io/"
Repository = "https://github.com/Tomaubier/CoperniFUS.git"
"Bug Tracker" = "https://github.com/Tomaubier/CoperniFUS/issues?q=is%3Aissue"

[project.scripts]
coperniFUS = "coperniFUS.__main__:main"